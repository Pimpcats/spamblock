# XcodeGen manifest — `scripts/bootstrap.sh` turns this into SpamBlock.xcodeproj.
#
# The bundle identifiers here must match Shared/AppConfiguration.swift and the
# two .entitlements files. `scripts/configure.sh <your-prefix>` rewrites all of
# them together.
name: SpamBlock

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode: nothing here needs Swift 6 strict concurrency, and
    # opting in only adds errors to work around on a first build.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Call blocking is an iPhone feature; there is no Call Directory on iPad.
    TARGETED_DEVICE_FAMILY: "1"
    # Set this to your Apple Developer Team ID to build to a device, or leave it
    # blank and pick a team in Xcode's Signing & Capabilities tab.
    DEVELOPMENT_TEAM: ""

targets:

  SpamBlock:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: SpamBlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spamblock
        INFOPLIST_FILE: SpamBlock/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpamBlock/SpamBlock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: CallDirectoryExtension
        embed: true
      - sdk: CallKit.framework

  CallDirectoryExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: CallDirectoryExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spamblock.CallDirectory
        INFOPLIST_FILE: CallDirectoryExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CallDirectoryExtension/CallDirectoryExtension.entitlements
    dependencies:
      - sdk: CallKit.framework

  SpamBlockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spamblock.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SpamBlock:
    build:
      targets:
        SpamBlock: all
        CallDirectoryExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpamBlockTests
