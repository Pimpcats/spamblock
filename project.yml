# XcodeGen manifest — `scripts/bootstrap.sh` turns this into SpamBlock.xcodeproj.
#
# The bundle identifiers here must match Shared/AppConfiguration.swift and the
# two .entitlements files. `scripts/configure.sh <your-prefix>` rewrites all of
# them together.
name: SpamBlock

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode: nothing here needs Swift 6 strict concurrency, and
    # opting in only adds errors to work around on a first build.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Call blocking is an iPhone feature; there is no Call Directory on iPad.
    TARGETED_DEVICE_FAMILY: "1"
    # Set this to your Apple Developer Team ID to build to a device, or leave it
    # blank and pick a team in Xcode's Signing & Capabilities tab.
    DEVELOPMENT_TEAM: ""
    # How many copies of the Call Directory extension the app ships. Each
    # carries one part of the area-code list, because one extension can only
    # hold so many numbers. Must match the CallDirectoryExtension targets
    # below — CI checks the built .ipa. Every copy costs one of a free Apple
    # ID's ten App IDs a week, so this is a trade between coverage and that
    # budget. The Known spam extension is separate and not counted here.
    SPAMBLOCK_SLICE_COUNT: "4"

targetTemplates:

  # Every copy of the extension is built from the same sources and Info.plist;
  # SPAMBLOCK_SLICE_NUMBER is the only thing that differs, and it decides which
  # part of the list that copy loads.
  CallDirectory:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: CallDirectoryExtension
    settings:
      base:
        INFOPLIST_FILE: CallDirectoryExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CallDirectoryExtension/CallDirectoryExtension.entitlements
    dependencies:
      - sdk: CallKit.framework
      - sdk: Contacts.framework

targets:

  SpamBlock:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: SpamBlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spamblock
        INFOPLIST_FILE: SpamBlock/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpamBlock/SpamBlock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: CallDirectoryExtension
        embed: true
      - target: CallDirectoryExtension2
        embed: true
      - target: CallDirectoryExtension3
        embed: true
      - target: CallDirectoryExtension4
        embed: true
      - target: KnownSpamExtension
        embed: true
      - sdk: CallKit.framework
      - sdk: Contacts.framework

  # Part 1 keeps the original bundle identifier, so an existing install — and
  # the App ID already registered for it — carries over.
  CallDirectoryExtension:
    templates: [CallDirectory]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spamblock.CallDirectory
        SPAMBLOCK_SLICE_NUMBER: "1"

  CallDirectoryExtension2:
    templates: [CallDirectory]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spamblock.CallDirectory2
        SPAMBLOCK_SLICE_NUMBER: "2"

  CallDirectoryExtension3:
    templates: [CallDirectory]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spamblock.CallDirectory3
        SPAMBLOCK_SLICE_NUMBER: "3"

  CallDirectoryExtension4:
    templates: [CallDirectory]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spamblock.CallDirectory4
        SPAMBLOCK_SLICE_NUMBER: "4"

  # Blocks numbers reported to the FTC as spam, from the list published by the
  # spamblock-data repository. It downloads that list itself, so unlike the
  # parts above it isn't a slice of anything: SpamBlockRole in its Info.plist
  # tells the app which extension it is. No entitlements — it keeps its copy of
  # the list in its own container and needs no App Group.
  KnownSpamExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: KnownSpamExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spamblock.KnownSpam
        INFOPLIST_FILE: KnownSpamExtension/Info.plist
    dependencies:
      - sdk: CallKit.framework
      - sdk: Contacts.framework

  SpamBlockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spamblock.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: Contacts.framework

schemes:
  SpamBlock:
    build:
      targets:
        SpamBlock: all
        CallDirectoryExtension: all
        CallDirectoryExtension2: all
        CallDirectoryExtension3: all
        CallDirectoryExtension4: all
        KnownSpamExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpamBlockTests
