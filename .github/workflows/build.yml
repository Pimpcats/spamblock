# Builds the app on a macOS runner, because Apple's toolchain only runs on macOS
# and there isn't one to hand. Two jobs:
#
#   test  — compiles everything and runs the unit tests in the Simulator, which
#           needs no signing and no Apple account at all.
#   ipa   — produces an unsigned SpamBlock.ipa for sideloading with AltStore or
#           SideStore, which re-sign it with your own free Apple ID.
name: Build

on:
  push:
    branches: ["**"]
    # Documentation doesn't change the app. macOS runners bill at ten times the
    # Linux rate against a monthly allowance, and this project exhausted it
    # once already — partly on rebuilds that could only produce the same .ipa.
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          # Runner images change their simulator line-up, so resolve a real one
          # rather than hard-coding a device name that may not exist.
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          best = None
          for runtime, entries in devices.items():
              if 'iOS' not in runtime:
                  continue
              for d in entries:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      key = tuple(int(n) for n in runtime.split('iOS-')[-1].split('-'))
                      if best is None or key > best[0]:
                          best = (key, d['udid'], d['name'], runtime)
          if best is None:
              sys.exit('no available iPhone simulator')
          print(best[1])
          sys.stderr.write(f'using {best[2]} on {best[3]}\n')
          ")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SpamBlock.xcodeproj \
            -scheme SpamBlock \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log

      # Artifacts are conveniences — the .ipa itself is published to the
      # builds branch — so a full artifact storage quota mustn't fail a build.
      # Private repositories get little of it, and it refills only as old
      # artifacts expire, hence the short retention.
      - name: Upload build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 5

  ipa:
    runs-on: macos-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SpamBlock.xcodeproj \
            -scheme SpamBlock \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SpamBlock.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee archive.log

      # Sideloaders decide which capabilities to set up — the App Group the
      # app and the area-code parts share, above all — from the entitlements
      # in the app's signature, and an unsigned build has none. Without the
      # App Group the app can't hand its list to the parts, so the list is
      # stuck at the built-in one. An ad-hoc signature carries the
      # entitlements without needing a certificate; the sideloader replaces
      # it with your own when it installs. Extensions first, then the app,
      # whose signature covers them.
      - name: Sign ad hoc with the entitlements
        run: |
          app="$RUNNER_TEMP/SpamBlock.xcarchive/Products/Applications/SpamBlock.app"
          sign() { codesign --force --sign - --timestamp=none "$@"; }
          for appex in "$app"/PlugIns/*.appex; do
            role=$(/usr/libexec/PlistBuddy -c "Print :SpamBlockRole" "$appex/Info.plist" 2>/dev/null || true)
            if [ "$role" = "known-spam" ]; then
              sign "$appex"   # keeps its own copy of the list; asks for nothing
            else
              sign --generate-entitlement-der \
                --entitlements CallDirectoryExtension/CallDirectoryExtension.entitlements "$appex"
            fi
          done
          sign --generate-entitlement-der --entitlements SpamBlock/SpamBlock.entitlements "$app"

      - name: Wrap as an unsigned .ipa
        run: |
          # An .ipa is just a zip with the .app inside a Payload directory.
          # AltStore/SideStore apply your own signature when they install it.
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/SpamBlock.xcarchive/Products/Applications/SpamBlock.app" \
                "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry SpamBlock.ipa Payload)
          ls -lh "$RUNNER_TEMP/SpamBlock.ipa"

      - name: Verify every extension is embedded
        run: |
          # An .ipa missing an extension installs cleanly and leaves that part
          # of the list unblocked, with nothing to say why — so every part is
          # checked here rather than discovered on a phone.
          cd "$RUNNER_TEMP"
          rm -rf verify && unzip -qo SpamBlock.ipa -d verify
          app="verify/Payload/SpamBlock.app"
          # A missing key prints nothing rather than aborting the step under
          # bash -e, so the checks below can say which key is missing.
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$2" 2>/dev/null || true; }

          echo "--- bundle ---"
          find "$app" -maxdepth 2 -mindepth 1 | sed "s|$app/||"

          expected=$(grep -E '^ +SPAMBLOCK_SLICE_COUNT:' "$GITHUB_WORKSPACE/project.yml" | grep -oE '[0-9]+' | head -1)
          if [ -z "$expected" ]; then
            echo "::error::SPAMBLOCK_SLICE_COUNT not found in project.yml"
            exit 1
          fi
          echo "expected parts: $expected"

          found=0
          known_spam=0
          numbers=""
          for appex in "$app"/PlugIns/*.appex; do
            [ -d "$appex" ] || continue
            info="$appex/Info.plist"
            point=$(plist NSExtension:NSExtensionPointIdentifier "$info")
            role=$(plist SpamBlockRole "$info")
            number=$(plist SpamBlockSliceNumber "$info")
            count=$(plist SpamBlockSliceCount "$info")
            printf '  %-32s %-40s %-18s "%s"\n' \
              "$(basename "$appex")" "$(plist CFBundleIdentifier "$info")" \
              "${role:-part $number of $count}" "$(plist CFBundleDisplayName "$info")"

            if [ "$point" != "com.apple.callkit.call-directory" ]; then
              echo "::error::$(basename "$appex") is a '$point' extension, not a call directory"
              exit 1
            fi
            # The known-spam list isn't a slice of the area codes; it's
            # counted separately and must not claim a part number.
            if [ "$role" = "known-spam" ]; then
              if [ -n "$number$count" ]; then
                echo "::error::$(basename "$appex") is the known-spam extension but also claims part $number of $count"
                exit 1
              fi
              known_spam=$((known_spam + 1))
              continue
            fi
            if [ "$count" != "$expected" ]; then
              echo "::error::$(basename "$appex") says there are $count parts; the build has $expected"
              exit 1
            fi
            found=$((found + 1))
            numbers="$numbers $number"
          done

          if [ "$found" -ne "$expected" ]; then
            echo "::error::found $found call directory extensions, expected $expected"
            exit 1
          fi
          # Every part number exactly once, 1 through N.
          have=$(echo $numbers | tr ' ' '\n' | sort -n | tr '\n' ' ' | sed 's/ $//')
          want=$(seq 1 "$expected" | tr '\n' ' ' | sed 's/ $//')
          if [ "$have" != "$want" ]; then
            echo "::error::part numbers are [$have], expected [$want]"
            exit 1
          fi
          if [ "$known_spam" -ne 1 ]; then
            echo "::error::found $known_spam known-spam extensions, expected 1"
            exit 1
          fi
          echo "OK: all $expected area-code parts embedded ($want), plus the known-spam extension"

          # The app and every area-code part must ask for the shared App
          # Group, or a sideloader won't set it up; see the signing step.
          group=$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" \
            "$GITHUB_WORKSPACE/SpamBlock/SpamBlock.entitlements")
          for bundle in "$app" "$app"/PlugIns/*.appex; do
            [ "$(plist SpamBlockRole "$bundle/Info.plist")" = "known-spam" ] && continue
            if ! codesign -d --entitlements - "$bundle" 2>&1 | grep -q "$group"; then
              echo "::error::$(basename "$bundle") doesn't ask for the App Group $group"
              exit 1
            fi
          done
          echo "OK: the app and every area-code part ask for $group"

      - name: Upload the .ipa
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SpamBlock-unsigned-ipa
          path: ${{ runner.temp }}/SpamBlock.ipa
          if-no-files-found: error
          retention-days: 5

      # Actions artifacts live on blob storage behind a login, which makes them
      # awkward to fetch from a phone or a script. A single-commit branch keeps
      # the newest .ipa at a stable URL on github.com instead.
      - name: Publish the .ipa to the builds branch
        run: |
          cd "$RUNNER_TEMP"
          rm -rf publish && mkdir publish && cd publish
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          cp "$RUNNER_TEMP/SpamBlock.ipa" .
          cat > README.md <<EOF
          Build output. Do not edit or open pull requests against this branch —
          every build replaces it wholesale.

          SpamBlock.ipa was built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}.
          It is unsigned; sideload it with Sideloadly or AltStore, and leave
          "Remove app extensions" switched off.
          EOF
          git add -A
          git commit -qm "SpamBlock.ipa from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/builds
          echo "published to the builds branch"

      - name: Upload archive log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: archive.log
          if-no-files-found: ignore
          retention-days: 5
